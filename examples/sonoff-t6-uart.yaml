# Merge the output/light/status_led/touch blocks into your working device YAML.
# Retain your existing Wi-Fi, API and OTA configuration.
esphome:
  name: sonoff-t6-uart

bk72xx:
  board: generic-bk7238

output:
  - platform: gpio
    pin: P6
    id: relay_right
  - platform: gpio
    pin: P26
    id: relay_left

light:
  - platform: binary
    name: Right Light
    id: right_relay_light
    output: relay_right
  - platform: binary
    name: Left Light
    id: left_relay_light
    output: relay_left

status_led:
  pin:
    number: P9
    inverted: false

external_components:
  - source: github://saltech1/esphome-sonoff-t6-uart@main
    components: [sonoff_t6]

logger:
  baud_rate: 0

uart:
  id: touch_uart
  rx_pin: P1
  baud_rate: 115200

sonoff_t6:
  id: touch_controller
  uart_id: touch_uart

binary_sensor:
  - platform: sonoff_t6
    sonoff_t6_id: touch_controller
    button_id: 3
    name: Left touch
    on_click:
      - min_length: 10ms
        max_length: 350ms
        then:
          - light.toggle: left_relay_light
  - platform: sonoff_t6
    sonoff_t6_id: touch_controller
    button_id: 1
    name: Right touch
    on_click:
      - min_length: 10ms
        max_length: 350ms
        then:
          - light.toggle: right_relay_light
