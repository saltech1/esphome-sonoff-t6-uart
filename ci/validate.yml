name: Validate
on: [push, pull_request]
jobs:
  bk7238:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install esphome==2026.9.1
      - run: python -m unittest discover -s tests
      - run: esphome compile examples/sonoff-t6-touch.yaml
